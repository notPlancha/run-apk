[project]
name = "run-apk"
version = "0.1.0"
description = "Fast, zero-config Android emulator runner and APK launcher CLI"
readme = "README.md"
authors = [
    { name = "notPlancha", email = "31565873+notPlancha@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.scripts]
run-apk = "run_apk.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "ty>=0.0.107",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
